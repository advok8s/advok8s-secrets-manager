# Per-ServiceAccount kubeconfigs merged into one multi-context kubeconfig
#
# Two ServiceAccounts (app-a, app-b) each get a SecretBuilder that mints a bound
# token via the TokenRequest API and renders a single-context kubeconfig from it
# (kubeconfig.from_service_account), with a distinct context name per account
# ("cluster-app-a" / "cluster-app-b"). A third SecretBuilder reads those two
# output Secrets as inputs and merges them into one kubeconfig holding both
# contexts (kubeconfig.merge), with onInputChange so it re-merges whenever either
# upstream kubeconfig is re-minted.
#
# Because each embedded token has a finite TTL, the per-SA builders set
# rotateEvery below expirationSeconds so the token is re-minted before it expires;
# the merged builder follows automatically via onInputChange.
#
# NOTE: the cluster `server` and CA in the rendered kubeconfigs come from the
# operator's --cluster-api-server flag (server URL) and the in-cluster
# kube-root-ca.crt ConfigMap (CA). If --cluster-api-server is unset the server
# field will be empty; set it on the operator for a usable kubeconfig.
#
#   Apply:    kubectl apply -f examples/secretbuilder-kubeconfig-merge.yaml
#   Verify:   kubectl get secret merged-kubeconfig -n demo-sb-kubeconfig \
#               -o jsonpath='{.data.config}' | base64 -d
#             # -> a kubeconfig with two contexts: cluster-app-a, cluster-app-b
#   Inspect:  kubectl get secret merged-kubeconfig -n demo-sb-kubeconfig \
#               -o jsonpath='{.data.config}' | base64 -d \
#               | kubectl --kubeconfig=/dev/stdin config get-contexts
#   Clean up: kubectl delete -f examples/secretbuilder-kubeconfig-merge.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-sb-kubeconfig
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-a
  namespace: demo-sb-kubeconfig
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-b
  namespace: demo-sb-kubeconfig
---
# Per-SA kubeconfig for app-a, context "cluster-app-a".
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  name: kubeconfig-app-a
  namespace: demo-sb-kubeconfig
spec:
  inputs:
    serviceAccount:
      serviceAccountRef:
        name: app-a
      expirationSeconds: 86400      # 24h; rotateEvery stays below this
  generator:
    script: |
      kc = kubeconfig.from_service_account(
          serviceAccount = input.serviceAccount,
          clusterName = "demo-cluster",
          userName = "app-a",
          contextName = "cluster-app-a",
      )
      secret = {"data": {"config": kc}}
  regeneration:
    rotateEvery: 12h                # re-mint the bound token before it expires
---
# Per-SA kubeconfig for app-b, context "cluster-app-b".
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  name: kubeconfig-app-b
  namespace: demo-sb-kubeconfig
spec:
  inputs:
    serviceAccount:
      serviceAccountRef:
        name: app-b
      expirationSeconds: 86400
  generator:
    script: |
      kc = kubeconfig.from_service_account(
          serviceAccount = input.serviceAccount,
          clusterName = "demo-cluster",
          userName = "app-b",
          contextName = "cluster-app-b",
      )
      secret = {"data": {"config": kc}}
  regeneration:
    rotateEvery: 12h
---
# Merge the two per-SA kubeconfigs into one with both contexts.
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  name: merged-kubeconfig
  namespace: demo-sb-kubeconfig
spec:
  inputs:
    secrets:
    - name: a
      secretRef:
        name: kubeconfig-app-a      # output Secret of the first builder
    - name: b
      secretRef:
        name: kubeconfig-app-b      # output Secret of the second builder
  generator:
    script: |
      configs = [
          input.secrets.a.data["config"],
          input.secrets.b.data["config"],
      ]
      merged = kubeconfig.merge(
          configs = configs,
          currentContext = "cluster-app-a",
      )
      secret = {"data": {"config": merged}}
  regeneration:
    onInputChange: true             # re-merge when either upstream is re-minted
