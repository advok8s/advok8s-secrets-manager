# SecretCopier - label-selected targets, with rename and added labels
#
# Copies "shared-config" from demo-copier-labels-source into every namespace
# labelled advok8s.io/demo=copy-here. Two of the three target namespaces below
# carry that label, so the copy lands in those two and not the third. The copy
# is renamed to "team-shared-config" and gets an extra label applied.
#
#   Apply:    kubectl apply -f examples/secretcopier-label-selector.yaml
#   Verify:   kubectl get secret team-shared-config -n demo-copier-labels-team-a
#             kubectl get secret team-shared-config -n demo-copier-labels-team-b
#             kubectl get secret team-shared-config -n demo-copier-labels-other   # NotFound (no label)
#   Clean up: kubectl delete -f examples/secretcopier-label-selector.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-copier-labels-source
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-copier-labels-team-a
  labels:
    advok8s.io/demo: copy-here
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-copier-labels-team-b
  labels:
    advok8s.io/demo: copy-here
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-copier-labels-other
---
apiVersion: v1
kind: Secret
metadata:
  name: shared-config
  namespace: demo-copier-labels-source
type: Opaque
stringData:
  api-endpoint: https://api.example.com
---
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretCopier
metadata:
  name: demo-copier-labels
spec:
  rules:
  - sourceSecret:
      name: shared-config
      namespace: demo-copier-labels-source
    targetNamespaces:
      labelSelector:
        matchLabels:
          advok8s.io/demo: copy-here
    targetSecret:
      name: team-shared-config
      labels:
        managed-by: advok8s-secrets-manager
    reclaimPolicy: Delete
