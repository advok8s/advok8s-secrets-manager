# SecretBuilder generating a CA and a CA-signed TLS leaf certificate
#
# Two generated certificates: a self-signed CA root, and a leaf signed by it
# (issuerRef.generated points at the CA declared earlier in the same builder).
# The script publishes a fullchain tls.crt (leaf + issuer, via tls.bundle), the
# leaf key, and the CA for clients to trust - a dependency-free way to get
# internal/workshop TLS without cert-manager.
#
#   Apply:    kubectl apply -f examples/secretbuilder-tls.yaml
#   Verify:   kubectl get secret app-tls -n demo-sb-tls -o jsonpath='{.data.tls\.crt}' \
#               | base64 -d | openssl x509 -text -noout 2>/dev/null \
#               || kubectl get secret app-tls -n demo-sb-tls
#             # the Secret is of type kubernetes.io/tls with tls.crt/tls.key/ca.crt
#   Clean up: kubectl delete -f examples/secretbuilder-tls.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-sb-tls
---
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  name: app-tls
  namespace: demo-sb-tls
spec:
  inputs:
    generated:
    - name: ca
      caCertificate:
        commonName: Demo Root CA
        duration: 87600h
    - name: serverCert
      tlsCertificate:
        commonName: app.demo.svc
        dnsNames:
        - app.demo.svc
        - app
        duration: 8760h
        issuerRef:
          generated: ca   # signed by the CA declared above
  output:
    type: kubernetes.io/tls
  generator:
    script: |
      c = input.generated.serverCert
      secret = {
        "data": {
          "tls.crt": tls.bundle([c.certPEM, c.caPEM]),  # fullchain: leaf + issuer
          "tls.key": c.keyPEM,
          "ca.crt": c.caPEM,
        },
      }
