# SecretBuilder using the gotemplate engine (template:) instead of Starlark
#
# The same inputs model, but the generator is a per-key map of gotemplate
# templates rather than a Starlark script. Each key's template produces that
# Secret data value, with Sprig functions available (e.g. b64enc) and
# missingkey=error so a typo'd reference fails loudly rather than emitting an
# empty value.
#
#   Apply:    kubectl apply -f examples/secretbuilder-template.yaml
#   Verify:   kubectl get secret app-config -n demo-sb-template \
#               -o jsonpath='{.data.message}' | base64 -d; echo
#             # -> hello from demo
#   Clean up: kubectl delete -f examples/secretbuilder-template.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-sb-template
---
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  name: app-config
  namespace: demo-sb-template
spec:
  inputs:
    constants:
      greeting: hello
      env: demo
  generator:
    # A gotemplate generator: one template per output Secret data key. The dot
    # context exposes .constants/.context/.secrets/.configMaps/.generated.
    template:
      data:
        message: '{{ .constants.greeting }} from {{ .constants.env }}'
        encoded: '{{ .constants.greeting | b64enc }}'
