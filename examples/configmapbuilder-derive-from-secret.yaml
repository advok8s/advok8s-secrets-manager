# ConfigMapBuilder - derive non-secret fields from a Secret
#
# The canonical pattern for publishing the non-secret parts of a Secret: a TLS
# secret's ca.crt and a credentials secret's username flow into a ConfigMap,
# while the private key and password stay in their Secrets. Cross-namespace
# distribution stays Secret-only (SecretCopier/SecretExporter, with their
# authorization machinery); derived non-secret config is built in place, in the
# namespace that needs it.
#
# With onInputChange, rotating the upstream certificate refreshes the published
# ca.crt automatically.
#
#   Apply:    kubectl apply -f examples/configmapbuilder-derive-from-secret.yaml
#   Verify:   kubectl get configmap service-info -n demo-cmbuilder-derive -o yaml
#   Clean up: kubectl delete -f examples/configmapbuilder-derive-from-secret.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-cmbuilder-derive
---
# A SecretBuilder stands in for the upstream TLS secret (in real use this might
# be cert-manager output or a copy made by SecretCopier).
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  name: service-tls
  namespace: demo-cmbuilder-derive
spec:
  inputs:
    generated:
    - name: ca
      caCertificate:
        commonName: demo-ca
  output:
    type: kubernetes.io/tls
  generator:
    script: |
      secret = {"data": {
          "tls.crt": input.generated.ca.certPEM,
          "tls.key": input.generated.ca.keyPEM,
      }}
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: demo-cmbuilder-derive
type: Opaque
stringData:
  username: app-reader
  password: never-published
---
apiVersion: configmaps.advok8s.io/v1beta1
kind: ConfigMapBuilder
metadata:
  name: service-info
  namespace: demo-cmbuilder-derive
spec:
  inputs:
    secrets:
    - name: tls
      secretRef:
        name: service-tls
    - name: db
      secretRef:
        name: db-credentials
  generator:
    script: |
      configMap = {"data": {
          # Only the non-secret parts of the inputs are published.
          "ca.crt": input.secrets.tls.data["tls.crt"],
          "username": input.secrets.db.data["username"],
      }}
  regeneration:
    onInputChange: true
