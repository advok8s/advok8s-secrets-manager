# SecretBuilder generating a password and an htpasswd file from it
#
# All randomness is operator-generated and declared under inputs.generated, then
# handed to the script as plain values. Here a password is generated once and
# used three ways: the plaintext value, a bcrypt htpasswd entry, and an HTTP
# Basic Authorization header - so hashing stays operator-side and the script
# never deals with base64 or salts.
#
#   Apply:    kubectl apply -f examples/secretbuilder-password-htpasswd.yaml
#   Verify:   kubectl get secret dashboard-auth -n demo-sb-htpasswd \
#               -o jsonpath='{.data.password}' | base64 -d; echo
#             kubectl get secret dashboard-auth -n demo-sb-htpasswd \
#               -o jsonpath='{.data.auth}' | base64 -d; echo
#             # -> admin:$2a$10$...  (a bcrypt htpasswd line)
#   Clean up: kubectl delete -f examples/secretbuilder-password-htpasswd.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-sb-htpasswd
---
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  name: dashboard-auth
  namespace: demo-sb-htpasswd
spec:
  inputs:
    constants:
      username: admin
    generated:
    - name: adminPassword
      password:
        length: 20
        symbols: true
        minDigits: 2
        excludeAmbiguous: true
  generator:
    script: |
      user = input.constants.username
      pw = input.generated.adminPassword.value
      secret = {
        "data": {
          "password": pw,
          "auth": htpasswd.bcrypt(entries = [{"username": user, "password": pw}]),
          "authHeader": basicauth.header(user, pw),
        },
      }
