# SecretExporter / SecretImporter pair (cross-namespace consent)
#
# A SecretExporter exports the secret named the same as itself, from its own
# namespace, into the target namespaces its rules match. Unlike a SecretCopier,
# an exporter is namespaced and always requires consent: a copy is made only
# where the target namespace contains a SecretImporter named the same as the
# target secret and carrying a matching shared secret.
#
# Because a namespaced exporter cannot own a resource in another namespace, the
# SecretImporter becomes the owner of the copy. Deleting the importer therefore
# garbage-collects the copied secret (try it - see below).
#
# Here the exporter "registry-creds" in demo-export-source exports its like-named
# secret into demo-export-target, where a matching importer consents to it. The
# rule does not rename the target, so the target secret (and thus the importer)
# is also named "registry-creds".
#
#   Apply:    kubectl apply -f examples/secretexporter-basic.yaml
#   Verify:   kubectl get secret registry-creds -n demo-export-target
#             kubectl get secretimporter registry-creds -n demo-export-target -o yaml
#             kubectl get secretexporter registry-creds -n demo-export-source -o yaml
#   GC test:  kubectl delete secretimporter registry-creds -n demo-export-target
#             kubectl get secret registry-creds -n demo-export-target   # -> NotFound
#   Clean up: kubectl delete -f examples/secretexporter-basic.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-export-source
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-export-target
---
# The source secret is named the same as the exporter, in the exporter's
# namespace.
apiVersion: v1
kind: Secret
metadata:
  name: registry-creds
  namespace: demo-export-source
type: Opaque
stringData:
  username: robot
  password: super-secret-token
---
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretExporter
metadata:
  name: registry-creds
  namespace: demo-export-source
spec:
  rules:
  - targetNamespaces:
      nameSelector:
        matchNames:
        - demo-export-target
    copyAuthorization:
      sharedSecret: please-change-me
---
# The importer must be named the same as the target secret (here "registry-creds",
# as the rule does not rename it) and carry the same shared secret as the
# exporter rule.
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretImporter
metadata:
  name: registry-creds
  namespace: demo-export-target
spec:
  copyAuthorization:
    sharedSecret: please-change-me
