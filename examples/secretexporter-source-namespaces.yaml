# SecretImporter restricting which source namespaces it accepts
#
# A SecretImporter can narrow the consent further with sourceNamespaces: even if
# an exporter's shared secret matches, the copy is accepted only when the source
# namespace also matches the importer's nameSelector. This scenario sets up two
# exporters of the same target secret, in two different source namespaces, both
# consented to by the same shared secret - but the importer only accepts one of
# them.
#
# Both exporters rename their target secret to "app-config" (via targetSecret.name),
# so the importer is named "app-config" rather than after either exporter. The
# importer accepts only demo-export-trusted as a source, so the export from
# demo-export-untrusted is refused even though its shared secret matches.
#
#   Apply:    kubectl apply -f examples/secretexporter-source-namespaces.yaml
#   Verify:   kubectl get secret app-config -n demo-export-consumer -o yaml
#             # annotation secrets.advok8s.io/secret-name should reference
#             # demo-export-trusted, never demo-export-untrusted
#   Clean up: kubectl delete -f examples/secretexporter-source-namespaces.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-export-trusted
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-export-untrusted
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-export-consumer
---
apiVersion: v1
kind: Secret
metadata:
  name: trusted-source
  namespace: demo-export-trusted
type: Opaque
stringData:
  origin: trusted
---
apiVersion: v1
kind: Secret
metadata:
  name: untrusted-source
  namespace: demo-export-untrusted
type: Opaque
stringData:
  origin: untrusted
---
# Trusted exporter: its like-named secret is exported to the consumer namespace,
# renamed to "app-config".
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretExporter
metadata:
  name: trusted-source
  namespace: demo-export-trusted
spec:
  rules:
  - targetNamespaces:
      nameSelector:
        matchNames:
        - demo-export-consumer
    targetSecret:
      name: app-config
    copyAuthorization:
      sharedSecret: please-change-me
---
# Untrusted exporter: targets the same secret name with the same shared secret,
# but the importer below does not list its namespace as an accepted source.
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretExporter
metadata:
  name: untrusted-source
  namespace: demo-export-untrusted
spec:
  rules:
  - targetNamespaces:
      nameSelector:
        matchNames:
        - demo-export-consumer
    targetSecret:
      name: app-config
    copyAuthorization:
      sharedSecret: please-change-me
---
# The importer is named after the (renamed) target secret. It accepts a copy
# only from demo-export-trusted, so the untrusted exporter's copy is refused.
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretImporter
metadata:
  name: app-config
  namespace: demo-export-consumer
spec:
  sourceNamespaces:
    nameSelector:
      matchNames:
      - demo-export-trusted
  copyAuthorization:
    sharedSecret: please-change-me
