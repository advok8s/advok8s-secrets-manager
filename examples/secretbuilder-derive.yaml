# SecretBuilder deriving a value from an existing Secret (no entropy)
#
# A SecretBuilder generates a Secret named the same as itself by running a
# Starlark script over its declared inputs. This scenario reads an existing
# Secret (decoded - the script never sees base64) and assembles a connection
# string from its fields. There is no generated/random material, so the output
# is a pure function of the input.
#
#   Apply:    kubectl apply -f examples/secretbuilder-derive.yaml
#   Verify:   kubectl get secretbuilder app-config -n demo-sb-derive
#             # -> READY True, GENERATED true
#             kubectl get secret app-config -n demo-sb-derive \
#               -o jsonpath='{.data.DATABASE_URL}' | base64 -d; echo
#             # -> postgres://app:s3cret@db.demo:5432/app
#   Clean up: kubectl delete -f examples/secretbuilder-derive.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-sb-derive
---
# The input Secret the builder reads.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: demo-sb-derive
type: Opaque
stringData:
  host: db.demo
  port: "5432"
  user: app
  password: s3cret
---
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  name: app-config
  namespace: demo-sb-derive
spec:
  inputs:
    secrets:
    # Bind the one Secret "db-credentials" to the handle "db" (a single struct).
    - name: db
      secretRef:
        name: db-credentials
  generator:
    script: |
      db = input.secrets.db.data
      url = "postgres://" + db["user"] + ":" + db["password"] + "@" + db["host"] + ":" + db["port"] + "/app"
      secret = {
        "data": {
          "DATABASE_URL": url,
        },
      }
