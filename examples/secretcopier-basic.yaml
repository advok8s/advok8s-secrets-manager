# SecretCopier - basic name-based copy
#
# Copies the "registry-credentials" secret from demo-copier-basic-source into
# demo-copier-basic-target, selecting the target namespace by exact name. With
# reclaimPolicy Delete the copy is owned by the SecretCopier and is removed when
# the SecretCopier is deleted.
#
#   Apply:    kubectl apply -f examples/secretcopier-basic.yaml
#   Verify:   kubectl get secret registry-credentials -n demo-copier-basic-target
#   Clean up: kubectl delete -f examples/secretcopier-basic.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-copier-basic-source
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-copier-basic-target
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: demo-copier-basic-source
type: Opaque
stringData:
  username: demo
  password: s3cr3t
---
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretCopier
metadata:
  name: demo-copier-basic
spec:
  rules:
  - sourceSecret:
      name: registry-credentials
      namespace: demo-copier-basic-source
    targetNamespaces:
      nameSelector:
        matchNames:
        - demo-copier-basic-target
    reclaimPolicy: Delete
