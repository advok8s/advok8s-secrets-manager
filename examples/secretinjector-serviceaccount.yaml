# SecretInjector targeting a named (non-default) ServiceAccount
#
# A SecretInjector adds references to matching secrets into matching service
# accounts. A secret of type kubernetes.io/dockerconfigjson is added to a service
# account's imagePullSecrets; any other type is added to its secrets. Injection
# is additive only - references are added, never removed - and idempotent.
#
# This scenario scopes the rule to a single named service account, "builder",
# leaving the namespace's "default" service account untouched so the difference
# is observable. The source secret is an image pull secret, so it lands in the
# builder service account's imagePullSecrets.
#
#   Apply:    kubectl apply -f examples/secretinjector-serviceaccount.yaml
#   Verify:   kubectl get serviceaccount builder -n demo-inject-sa -o yaml
#             # -> imagePullSecrets includes "registry-credentials"
#             kubectl get serviceaccount default -n demo-inject-sa -o yaml
#             # -> unchanged: no imagePullSecrets injected
#             kubectl get secretinjector demo-inject-sa -o yaml   # status counts
#   Clean up: kubectl delete -f examples/secretinjector-serviceaccount.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-inject-sa
---
# The service account we want the image pull secret injected into. The namespace
# also has the auto-created "default" service account, which this rule does not
# target.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: builder
  namespace: demo-inject-sa
---
# An image pull secret (type kubernetes.io/dockerconfigjson). The injector adds
# dockerconfigjson secrets to imagePullSecrets rather than secrets. The auth
# value below is a placeholder ("user:pass" base64-encoded).
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: demo-inject-sa
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"registry.example.com":{"username":"user","password":"pass","auth":"dXNlcjpwYXNz"}}}
---
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretInjector
metadata:
  name: demo-inject-sa
spec:
  rules:
  # Inject "registry-credentials" into only the "builder" service account, only
  # in the demo-inject-sa namespace. Source-secret and service-account names are
  # matched by exact membership. Omitting serviceAccounts would inject into every
  # service account in a matched namespace (including default).
  - sourceSecrets:
      nameSelector:
        matchNames:
        - registry-credentials
    targetNamespaces:
      nameSelector:
        matchNames:
        - demo-inject-sa
    serviceAccounts:
      nameSelector:
        matchNames:
        - builder
