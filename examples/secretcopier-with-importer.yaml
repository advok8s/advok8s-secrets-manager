# SecretCopier gated by a SecretImporter (copyAuthorization)
#
# The SecretCopier rule sets copyAuthorization.sharedSecret, so a copy is made
# into a target namespace only if that namespace contains a SecretImporter named
# the same as the target secret and carrying a matching shared secret. This lets
# the owner of a namespace consent to receiving the secret. The SecretCopier
# (not the importer) remains the owner of the copy.
#
# Here demo-copier-auth-target has a matching SecretImporter, so the copy is made.
# Try removing just the SecretImporter and re-applying: with no authorisation the
# copy is no longer (re)created. (An existing copy is not deleted automatically -
# delete this whole file to clean up.)
#
#   Apply:    kubectl apply -f examples/secretcopier-with-importer.yaml
#   Verify:   kubectl get secret shared-app-secret -n demo-copier-auth-target
#             kubectl get secretimporter shared-app-secret -n demo-copier-auth-target -o yaml
#   Clean up: kubectl delete -f examples/secretcopier-with-importer.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-copier-auth-source
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-copier-auth-target
---
apiVersion: v1
kind: Secret
metadata:
  name: shared-app-secret
  namespace: demo-copier-auth-source
type: Opaque
stringData:
  token: super-secret-token
---
# The importer must be named the same as the target secret (here the source
# name, as the rule does not rename it) and carry the same shared secret as the
# SecretCopier rule.
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretImporter
metadata:
  name: shared-app-secret
  namespace: demo-copier-auth-target
spec:
  copyAuthorization:
    sharedSecret: please-change-me
---
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretCopier
metadata:
  name: demo-copier-auth
spec:
  rules:
  - sourceSecret:
      name: shared-app-secret
      namespace: demo-copier-auth-source
    targetNamespaces:
      nameSelector:
        matchNames:
        - demo-copier-auth-target
    copyAuthorization:
      sharedSecret: please-change-me
    reclaimPolicy: Delete
