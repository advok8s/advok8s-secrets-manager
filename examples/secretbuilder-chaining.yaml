# Chained SecretBuilders: an upstream change propagates to a downstream builder
#
# "shared-password" generates a password into a Secret. "derived-config" reads
# that Secret as an input and, because it opts into onInputChange, refreshes
# whenever the upstream Secret changes. The operator watches the input Secret and
# folds its content-revision into a fingerprint, so the chain converges without
# the downstream builder re-rolling its own material.
#
#   Apply:    kubectl apply -f examples/secretbuilder-chaining.yaml
#   Verify:   kubectl get secret derived-config -n demo-sb-chain \
#               -o jsonpath='{.data.connection}' | base64 -d; echo
#             # -> contains the same password as the shared-password Secret
#   Rotate:   kubectl annotate secretbuilder/shared-password -n demo-sb-chain \
#               secrets.advok8s.io/regenerate="$(date +%s)" --overwrite
#             # -> shared-password rotates; derived-config follows automatically
#   Clean up: kubectl delete -f examples/secretbuilder-chaining.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-sb-chain
---
# Upstream: generates a password.
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  name: shared-password
  namespace: demo-sb-chain
spec:
  inputs:
    generated:
    - name: pw
      password:
        length: 16
  generator:
    script: |
      secret = {"data": {"password": input.generated.pw.value}}
---
# Downstream: derives from the upstream Secret and reacts to its changes.
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  name: derived-config
  namespace: demo-sb-chain
spec:
  inputs:
    secrets:
    - name: shared
      secretRef:
        name: shared-password   # the upstream builder's output Secret
  generator:
    script: |
      pw = input.secrets.shared.data["password"]
      secret = {"data": {"connection": "user:" + pw + "@db.demo:5432/app"}}
  regeneration:
    onInputChange: true          # refresh when the upstream Secret changes
