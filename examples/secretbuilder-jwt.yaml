# SecretBuilder signing a JWT with a generated RSA key, rotated before expiry
#
# A generated RSA key signs a JWT whose iat/exp derive from the operator's
# persisted generatedAt, so the token is reproducible across refreshes. The
# token expires in 1h; rotateEvery re-mints it at 50m (a buffer), and
# rotateGenerated: false keeps the same signing key across rotations so existing
# verifiers keep working - only the token's validity window advances.
#
#   Apply:    kubectl apply -f examples/secretbuilder-jwt.yaml
#   Verify:   kubectl get secret api-token -n demo-sb-jwt \
#               -o jsonpath='{.data.token}' | base64 -d; echo
#             # paste into https://jwt.io (or decode locally) to see iss/sub/iat/exp
#             kubectl get secretbuilder api-token -n demo-sb-jwt -o wide
#             # -> NEXT ROTATION ~50m after generation
#   Clean up: kubectl delete -f examples/secretbuilder-jwt.yaml
#
# Requires the CRDs installed and the operator running.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-sb-jwt
---
apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  name: api-token
  namespace: demo-sb-jwt
spec:
  inputs:
    constants:
      issuer: https://demo.example
      subject: service-account
    generated:
    - name: signingKey
      rsaPrivateKey:
        rsaBits: 2048
  generator:
    script: |
      key = input.generated.signingKey
      token = jwt.sign(
        claims = {"iss": input.constants.issuer, "sub": input.constants.subject},
        key = key.privatePEM,
        alg = "RS256",
        expiresIn = "1h",   # exp = generatedAt + 1h
      )
      secret = {
        "data": {
          "token": token,
          "public.pem": key.publicPEM,   # publish for verification
        },
      }
  regeneration:
    rotateEvery: 50m       # re-mint before the 1h expiry, with a buffer
    rotateGenerated: false # keep the same signing key across rotations
