apiVersion: secrets.advok8s.io/v1beta1
kind: SecretImporter
metadata:
  labels:
    app.kubernetes.io/name: advok8s-secrets-manager
    app.kubernetes.io/managed-by: kustomize
  # The importer must be named the same as the target secret it authorizes.
  # Paired with the SecretExporter sample above, whose target secret defaults to
  # the exporter's name.
  name: secretexporter-sample
spec:
  # Optional: restrict which source namespaces a copy may originate from. Omit
  # to accept any source namespace.
  sourceNamespaces:
    nameSelector:
      matchNames:
      - platform
  # Must match the exporter's (or copier's) copyAuthorization.sharedSecret. When
  # a SecretExporter omits its shared secret, use the exporter's UID here.
  copyAuthorization:
    sharedSecret: please-change-me
