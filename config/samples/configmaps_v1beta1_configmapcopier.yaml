apiVersion: configmaps.advok8s.io/v1beta1
kind: ConfigMapCopier
metadata:
  labels:
    app.kubernetes.io/name: advok8s-secrets-manager
    app.kubernetes.io/managed-by: kustomize
  name: configmapcopier-sample
spec:
  rules:
  # Copy the shared-settings ConfigMap from the platform namespace into every
  # namespace labelled team=backend, adding a label on the copy. There is no
  # copyAuthorization for ConfigMaps: distribution is admin-operated.
  - sourceConfigMap:
      namespace: platform
      name: shared-settings
    targetNamespaces:
      labelSelector:
        matchLabels:
          team: backend
    targetConfigMap:
      name: shared-settings
      labels:
        managed-by: advok8s-secrets-manager
    reclaimPolicy: Delete
