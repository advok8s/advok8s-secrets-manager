apiVersion: secrets.advok8s.io/v1beta1
kind: SecretInjector
metadata:
  labels:
    app.kubernetes.io/name: advok8s-secrets-manager
    app.kubernetes.io/managed-by: kustomize
  name: secretinjector-sample
spec:
  # Re-reconcile interval. Defaults to "1m"; set "0s" to disable periodic
  # re-sync (injections still apply in response to secret, service account and
  # namespace changes).
  syncPeriod: 1m
  rules:
  # Inject a reference to the "registry-credentials" secret into the "default"
  # service account of every namespace labelled team=backend. Image pull secrets
  # (type kubernetes.io/dockerconfigjson) are added to imagePullSecrets; other
  # secret types are added to secrets. Source-secret and service-account names
  # are matched by exact membership, not glob. Leave serviceAccounts unset to
  # inject into every service account in a matched namespace.
  - sourceSecrets:
      nameSelector:
        matchNames:
        - registry-credentials
    targetNamespaces:
      labelSelector:
        matchLabels:
          team: backend
    serviceAccounts:
      nameSelector:
        matchNames:
        - default
