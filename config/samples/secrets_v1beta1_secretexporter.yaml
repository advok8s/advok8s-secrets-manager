apiVersion: secrets.advok8s.io/v1beta1
kind: SecretExporter
metadata:
  labels:
    app.kubernetes.io/name: advok8s-secrets-manager
    app.kubernetes.io/managed-by: kustomize
  name: secretexporter-sample
spec:
  # Re-reconcile interval. Defaults to "1m"; set "0s" to disable periodic
  # re-sync (copies still update in response to source and namespace changes).
  syncPeriod: 1m
  rules:
  # The exporter's own name is the source secret: the secret named
  # "secretexporter-sample" in this namespace is exported into every matched
  # namespace. A copy is only made where that namespace contains a
  # SecretImporter named the same as the target secret, carrying a matching
  # shared secret (see the SecretImporter sample). The importer becomes the
  # owner of the copy.
  - targetNamespaces:
      nameSelector:
        matchNames:
        - "!kube-*"
    targetSecret:
      labels:
        managed-by: advok8s-secrets-manager
    copyAuthorization:
      sharedSecret: please-change-me
