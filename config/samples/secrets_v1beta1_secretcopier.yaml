apiVersion: secrets.advok8s.io/v1beta1
kind: SecretCopier
metadata:
  labels:
    app.kubernetes.io/name: advok8s-secrets-manager
    app.kubernetes.io/managed-by: kustomize
  name: secretcopier-sample
spec:
  rules:
  # Copy the registry-credentials Secret from the platform namespace into every
  # namespace labelled team=backend, renaming it and adding a label on the copy.
  - sourceSecret:
      namespace: platform
      name: registry-credentials
    targetNamespaces:
      labelSelector:
        matchLabels:
          team: backend
    targetSecret:
      name: registry-credentials
      labels:
        managed-by: advok8s-secrets-manager
    reclaimPolicy: Delete
