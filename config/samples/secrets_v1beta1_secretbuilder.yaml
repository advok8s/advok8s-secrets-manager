apiVersion: secrets.advok8s.io/v1beta1
kind: SecretBuilder
metadata:
  labels:
    app.kubernetes.io/name: advok8s-secrets-manager
    app.kubernetes.io/managed-by: kustomize
  name: secretbuilder-sample
spec:
  # Inputs the generator may read. Here, a single operator-generated password.
  # All randomness is declared here so the script stays deterministic.
  inputs:
    generated:
    - name: adminPassword
      password:
        length: 24
        symbols: true
        minDigits: 2
  # The generator: a Starlark script that sets the `secret` global. The produced
  # Secret is named the same as this SecretBuilder ("secretbuilder-sample"). Use
  # `template:` instead of `script:` for a gotemplate generator.
  generator:
    script: |
      secret = {
        "data": {
          "password": input.generated.adminPassword.value,
        },
      }
  # Default regeneration is generate-once: the Secret is produced when absent and
  # then left alone. Uncomment to opt into rotation:
  # regeneration:
  #   rotateEvery: 720h
  #   rotateGenerated: true
