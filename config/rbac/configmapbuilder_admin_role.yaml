# This rule is not used by the project advok8s-secrets-manager itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over configmaps.advok8s.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: advok8s-secrets-manager
    app.kubernetes.io/managed-by: kustomize
  name: configmapbuilder-admin-role
rules:
- apiGroups:
  - configmaps.advok8s.io
  resources:
  - configmapbuilders
  verbs:
  - '*'
- apiGroups:
  - configmaps.advok8s.io
  resources:
  - configmapbuilders/status
  verbs:
  - get
