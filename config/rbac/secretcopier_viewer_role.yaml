# This rule is not used by the project advok8s-secrets-manager itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to secrets.advok8s.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: advok8s-secrets-manager
    app.kubernetes.io/managed-by: kustomize
  name: secretcopier-viewer-role
rules:
- apiGroups:
  - secrets.advok8s.io
  resources:
  - secretcopiers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - secrets.advok8s.io
  resources:
  - secretcopiers/status
  verbs:
  - get
