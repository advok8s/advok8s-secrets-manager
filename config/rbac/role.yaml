---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  verbs:
  - create
- apiGroups:
  - configmaps.advok8s.io
  resources:
  - configmapbuilders
  - configmapcopiers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - configmaps.advok8s.io
  resources:
  - configmapbuilders/finalizers
  - configmapcopiers/finalizers
  verbs:
  - update
- apiGroups:
  - configmaps.advok8s.io
  resources:
  - configmapbuilders/status
  - configmapcopiers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - secrets.advok8s.io
  resources:
  - secretbuilders
  - secretcopiers
  - secretexporters
  - secretimporters
  - secretinjectors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - secrets.advok8s.io
  resources:
  - secretbuilders/finalizers
  - secretcopiers/finalizers
  - secretexporters/finalizers
  - secretimporters/finalizers
  - secretinjectors/finalizers
  verbs:
  - update
- apiGroups:
  - secrets.advok8s.io
  resources:
  - secretbuilders/status
  - secretcopiers/status
  - secretexporters/status
  - secretimporters/status
  - secretinjectors/status
  verbs:
  - get
  - patch
  - update
