---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - secrets.advok8s.io
  resources:
  - secretcopiers
  - secretexporters
  - secretimporters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - secrets.advok8s.io
  resources:
  - secretcopiers/finalizers
  - secretexporters/finalizers
  - secretimporters/finalizers
  verbs:
  - update
- apiGroups:
  - secrets.advok8s.io
  resources:
  - secretcopiers/status
  - secretexporters/status
  - secretimporters/status
  verbs:
  - get
  - patch
  - update
